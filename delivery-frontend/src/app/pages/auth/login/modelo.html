<!DOCTYPE html>

<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - Delivery App</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap"
      rel="stylesheet"
    />
    <style type="text/tailwindcss">
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#f27f0d",
              "background-light": "#f8f7f5",
              "background-dark": "#221910",
              "text-light": "#1c140d",
              "text-dark": "#f8f7f5",
              "subtle-light": "#e8dbce",
              "subtle-dark": "#443b31",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark"
  >
    <div
      class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden p-4"
    >
      <div
        class="flex w-full max-w-md flex-col items-center justify-center gap-4"
      >
        <!-- App Logo -->
        <div class="mb-4">
          <svg
            fill="none"
            height="64"
            viewbox="0 0 64 64"
            width="64"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect fill="#f27f0d" height="64" rx="24" width="64"></rect>
            <path
              d="M32 16L48 27.0556V49.1667L32 60L16 49.1667V27.0556L32 16Z"
              fill="#F8F7F5"
            ></path>
            <path
              d="M32 23L44 29.5V42.5L32 49L20 42.5V29.5L32 23Z"
              fill="#F27F0D"
            ></path>
            <path
              d="M26 36L32 39.5L38 36V29L32 25.5L26 29V36Z"
              fill="#F8F7F5"
            ></path>
          </svg>
        </div>
        <!-- Headline Text -->
        <h1
          class="text-text-light dark:text-text-dark tracking-tight text-3xl font-bold text-center pb-2"
        >
          Inicia Sesión
        </h1>
        <!-- Form -->
        <div class="flex w-full flex-col gap-4">
          <!-- Email/Phone TextField -->
          <div class="flex w-full flex-wrap items-end">
            <label class="flex w-full flex-col flex-1">
              <p
                class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2"
              >
                Email o Teléfono
              </p>
              <input
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 border border-subtle-light dark:border-subtle-dark bg-background-light dark:bg-background-dark focus:border-primary focus:ring-2 focus:ring-primary/20 h-14 placeholder:text-subtle-light dark:placeholder:text-subtle-dark p-[15px] text-base font-normal leading-normal"
                placeholder="Ingresa tu email o teléfono"
                value=""
              />
            </label>
          </div>
          <!-- Password TextField -->
          <div class="flex w-full flex-wrap items-end">
            <label class="flex w-full flex-col flex-1">
              <p
                class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2"
              >
                Contraseña
              </p>
              <div class="flex w-full flex-1 items-stretch">
                <input
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-text-light dark:text-text-dark focus:outline-0 border border-subtle-light dark:border-subtle-dark bg-background-light dark:bg-background-dark focus:border-primary focus:ring-2 focus:ring-primary/20 h-14 placeholder:text-subtle-light dark:placeholder:text-subtle-dark p-[15px] border-r-0 pr-2 text-base font-normal leading-normal"
                  placeholder="Ingresa tu contraseña"
                  type="password"
                  value=""
                />
                <div
                  class="text-text-light/80 dark:text-text-dark/80 flex border border-subtle-light dark:border-subtle-dark bg-background-light dark:bg-background-dark items-center justify-center px-4 rounded-r-lg border-l-0"
                >
                  <span class="material-symbols-outlined cursor-pointer"
                    >visibility_off</span
                  >
                </div>
              </div>
            </label>
          </div>
          <!-- Forgot Password Link -->
          <p
            class="text-primary dark:text-primary text-sm font-medium leading-normal pt-1 text-right underline cursor-pointer"
          >
            ¿Olvidaste tu contraseña?
          </p>
        </div>
        <!-- Login Button -->
        <button
          class="flex w-full items-center justify-center rounded-lg bg-primary text-white h-14 text-base font-bold leading-normal mt-4"
        >
          Ingresar
        </button>
        <!-- Divider -->
        <div class="flex w-full items-center gap-4 py-4">
          <hr
            class="w-full border-t border-subtle-light dark:border-subtle-dark"
          />
          <span
            class="text-text-light/60 dark:text-text-dark/60 text-sm font-medium"
            >o</span
          >
          <hr
            class="w-full border-t border-subtle-light dark:border-subtle-dark"
          />
        </div>
        <!-- Social Login -->
        <div class="flex w-full flex-col gap-3">
          <h3
            class="text-center text-sm font-medium text-text-light/80 dark:text-text-dark/80 mb-1"
          >
            Otros tipos de inicio de sesión
          </h3>
          <div
            class="flex w-full flex-col items-center justify-center gap-4 sm:flex-row"
          >
            <button
              class="flex w-full items-center justify-center gap-3 rounded-lg border border-subtle-light dark:border-subtle-dark bg-background-light dark:bg-background-dark h-12 px-4 text-sm font-semibold"
            >
              <img
                alt="Google logo"
                class="h-6 w-6"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHSxcfeewD0l4iCUfBzxYmZChpgj-9GCXyiTLYLRYdFNdiiz_V5VCso8v5ZG2GBhuo-_yLmLzckKxeMhWhZm_XkdK85jX9b9tuqRYWwI-fUfKAkgdspIgJq4giW8lOFONvyxhIm56ky5-A-aiyWs_LAz6hC9-7Gmr3vmbhpa_LwPBS6U0f1tP2BCEyMGVNlnVgU7O--8enAz10TQNuIgoYkDhjyyG_kNWlYMxh1na60ZRwHNIfXVWzIYCnen2l0vRAd8LXj-zP42k"
              />
              <span>Continuar con Google</span>
            </button>
            <button
              class="flex w-full items-center justify-center gap-3 rounded-lg border border-subtle-light dark:border-subtle-dark bg-background-light dark:bg-background-dark h-12 px-4 text-sm font-semibold"
            >
              <img
                alt="Facebook logo"
                class="h-6 w-6"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBIWtyU6bXYbbfo9vhcn5QjSfkvN_YtZsaz-WeExCOwDvZkGnY4wMuQPrbcIp0hyV2GZZMdWMnZYWptgVd3P_Bw3uZP-NhjWDrT3BA5R_bNqPBKJBU4JtqyKbstqO8X6jMGc5D4RGXgp1Xkyjl0Pslivqd1aLUPfclmfvWhcIutyAS7ozxqrDLaPseZuZ6UlwHZro4xbNBz7TKlpa7OTSQv3K5DLDr417nx8TaJKzMtuTpEHLIQD9JW4WdyKGAkGFKpLjaWxdfU6CE"
              />
              <span>Continuar con Facebook</span>
            </button>
          </div>
        </div>
        <!-- Create Account -->
        <div class="mt-6 flex items-center justify-center gap-2">
          <p
            class="text-text-light/80 dark:text-text-dark/80 text-sm font-normal"
          >
            ¿No tienes una cuenta?
          </p>
          <button class="font-bold text-primary underline">Crear Cuenta</button>
        </div>
      </div>
    </div>
  </body>
</html>
