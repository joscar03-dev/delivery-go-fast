<ion-content class="ion-padding">
  <app-wave-background></app-wave-background>

  <!-- Header personalizado dentro del content -->
  <div class="custom-header">
    <ion-buttons>
      <ion-back-button defaultHref="/tabs/business"></ion-back-button>
    </ion-buttons>
    <h1 class="header-title">Iniciar Sesión</h1>
    <div class="header-spacer"></div>
  </div>
  <div class="login-container">
    <div class="login-wrapper">
      <!-- App Logo -->
      <div class="logo-container">
        <svg
          fill="none"
          height="64"
          viewBox="0 0 64 64"
          width="64"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect fill="#f27f0d" height="64" rx="24" width="64"></rect>
          <path
            d="M32 16L48 27.0556V49.1667L32 60L16 49.1667V27.0556L32 16Z"
            fill="#F8F7F5"
          ></path>
          <path
            d="M32 23L44 29.5V42.5L32 49L20 42.5V29.5L32 23Z"
            fill="#F27F0D"
          ></path>
          <path
            d="M26 36L32 39.5L38 36V29L32 25.5L26 29V36Z"
            fill="#F8F7F5"
          ></path>
        </svg>
      </div>

      <!-- Form -->
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate
        class="auth-form"
      >
        <!-- Email/Phone Field -->
        <div class="form-field">
          <label class="field-label">
            <p class="label-text">Email o Teléfono</p>
            <input
              type="text"
              formControlName="identifier"
              autocomplete="username"
              placeholder="Ingresa tu email o teléfono"
              class="field-input"
            />
            <span
              *ngIf="form.controls.identifier.touched && form.controls.identifier.invalid"
              class="field-error"
            >
              Formato inválido. Usa un email válido, 9 dígitos locales o
              teléfono E.164.
            </span>
          </label>
        </div>

        <!-- Password Field -->
        <div class="form-field">
          <label class="field-label">
            <p class="label-text">Contraseña</p>
            <input
              type="password"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Ingresa tu contraseña"
              class="field-input"
            />
            <span
              *ngIf="form.controls.password.touched && form.controls.password.invalid"
              class="field-error"
            >
              Mínimo 6 caracteres.
            </span>
          </label>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          [disabled]="form.invalid || loading"
          class="btn-primary"
        >
          {{ loading ? 'Ingresando…' : 'Ingresar' }}
        </button>

        <!-- Divider -->
        <div class="divider">
          <hr class="divider-line" />
          <span class="divider-text">o</span>
          <hr class="divider-line" />
        </div>

        <!-- Phone Login Button -->
        <button
          type="button"
          (click)="goToPhoneLogin()"
          class="btn-secondary"
          backgroundColor="primary"
        >
          <ion-icon name="call"></ion-icon>
          <span>Iniciar con Teléfono</span>
        </button>

        <!-- Create Account Link -->
        <div class="auth-links">
          <p class="link-text">¿No tienes una cuenta?</p>
          <button type="button" (click)="goToRegister()" class="link-button">
            Crear Cuenta
          </button>
        </div>
      </form>
    </div>
  </div>
</ion-content>
