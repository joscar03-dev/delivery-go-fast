<!DOCTYPE html>

<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Crear Cuenta - Delivery App</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#f27f0d",
              "background-light": "#f8f7f5",
              "background-dark": "#221910",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="font-display bg-background-light dark:bg-background-dark">
    <div
      class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden"
    >
      <!-- Top App Bar -->
      <div
        class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10"
      >
        <div
          class="flex size-10 shrink-0 items-center justify-center rounded-full text-zinc-900 dark:text-zinc-200"
        >
          <span class="material-symbols-outlined text-2xl">arrow_back</span>
        </div>
        <h1
          class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center text-zinc-900 dark:text-zinc-100 pr-10"
        >
          Crear Cuenta
        </h1>
      </div>
      <!-- Main Content -->
      <main class="flex-1 flex flex-col p-4">
        <div class="flex-1 flex flex-col justify-center">
          <!-- Logo/Icon -->
          <div class="flex justify-center mb-8">
            <div class="bg-primary/20 rounded-lg p-4 text-primary">
              <span class="material-symbols-outlined !text-5xl"
                >local_mall</span
              >
            </div>
          </div>
          <h2
            class="text-2xl font-bold text-center text-zinc-900 dark:text-zinc-100 mb-2"
          >
            Bienvenido
          </h2>
          <p class="text-center text-zinc-600 dark:text-zinc-400 mb-8">
            Crea tu cuenta para empezar a pedir.
          </p>
          <!-- Form Fields -->
          <div class="flex flex-col gap-4">
            <!-- Name Field -->
            <label class="flex flex-col w-full">
              <p
                class="text-base font-medium leading-normal pb-2 text-zinc-900 dark:text-zinc-100"
              >
                Nombre
              </p>
              <input
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-zinc-900 dark:text-zinc-100 focus:outline-0 focus:ring-2 focus:ring-primary border border-zinc-300 dark:border-zinc-700 bg-background-light dark:bg-zinc-800/50 focus:border-primary h-14 placeholder:text-zinc-400 dark:placeholder:text-zinc-500 p-4 text-base font-normal leading-normal"
                placeholder="Ingresa tu nombre completo"
                type="text"
                value=""
              />
            </label>
            <!-- Phone Field -->
            <label class="flex flex-col w-full">
              <p
                class="text-base font-medium leading-normal pb-2 text-zinc-900 dark:text-zinc-100"
              >
                Teléfono
              </p>
              <input
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-zinc-900 dark:text-zinc-100 focus:outline-0 focus:ring-2 focus:ring-primary border border-zinc-300 dark:border-zinc-700 bg-background-light dark:bg-zinc-800/50 focus:border-primary h-14 placeholder:text-zinc-400 dark:placeholder:text-zinc-500 p-4 text-base font-normal leading-normal"
                placeholder="Ingresa tu número de teléfono"
                type="tel"
                value=""
              />
            </label>
            <!-- Password Field -->
            <label class="flex flex-col w-full">
              <p
                class="text-base font-medium leading-normal pb-2 text-zinc-900 dark:text-zinc-100"
              >
                Contraseña
              </p>
              <div class="flex w-full flex-1 items-stretch rounded-lg group">
                <input
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-zinc-900 dark:text-zinc-100 focus:outline-0 focus:ring-2 focus:ring-primary border border-zinc-300 dark:border-zinc-700 bg-background-light dark:bg-zinc-800/50 focus:border-primary h-14 placeholder:text-zinc-400 dark:placeholder:text-zinc-500 p-4 rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal group-focus-within:border-primary group-focus-within:ring-2 group-focus-within:ring-primary"
                  placeholder="Crea una contraseña segura"
                  type="password"
                  value=""
                />
                <div
                  class="text-zinc-400 dark:text-zinc-500 flex border border-zinc-300 dark:border-zinc-700 bg-background-light dark:bg-zinc-800/50 items-center justify-center px-4 rounded-r-lg border-l-0 group-focus-within:border-primary group-focus-within:ring-2 group-focus-within:ring-primary"
                >
                  <span class="material-symbols-outlined">visibility</span>
                </div>
              </div>
            </label>
            <!-- Confirm Password Field -->
            <label class="flex flex-col w-full">
              <p
                class="text-base font-medium leading-normal pb-2 text-zinc-900 dark:text-zinc-100"
              >
                Confirmar Contraseña
              </p>
              <div class="flex w-full flex-1 items-stretch rounded-lg group">
                <input
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-zinc-900 dark:text-zinc-100 focus:outline-0 focus:ring-2 focus:ring-primary border border-zinc-300 dark:border-zinc-700 bg-background-light dark:bg-zinc-800/50 focus:border-primary h-14 placeholder:text-zinc-400 dark:placeholder:text-zinc-500 p-4 rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal group-focus-within:border-primary group-focus-within:ring-2 group-focus-within:ring-primary"
                  placeholder="Confirma tu contraseña"
                  type="password"
                  value=""
                />
                <div
                  class="text-zinc-400 dark:text-zinc-500 flex border border-zinc-300 dark:border-zinc-700 bg-background-light dark:bg-zinc-800/50 items-center justify-center px-4 rounded-r-lg border-l-0 group-focus-within:border-primary group-focus-within:ring-2 group-focus-within:ring-primary"
                >
                  <span class="material-symbols-outlined">visibility_off</span>
                </div>
              </div>
            </label>
          </div>
        </div>
        <!-- Bottom Actions -->
        <div class="py-6 space-y-4">
          <button
            class="flex w-full items-center justify-center rounded-lg bg-primary h-14 text-white text-base font-bold leading-normal transition-colors hover:bg-primary/90"
          >
            Crear Cuenta
          </button>
          <p class="text-center text-sm text-zinc-600 dark:text-zinc-400">
            ¿Ya tienes cuenta?
            <a class="font-bold text-primary hover:underline" href="#"
              >Inicia sesión</a
            >
          </p>
          <p class="text-center text-xs text-zinc-500 dark:text-zinc-500 px-4">
            Al crear tu cuenta, aceptas nuestros
            <a class="underline" href="#">Términos y Condiciones</a> y nuestra
            <a class="underline" href="#">Política de Privacidad</a>.
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
