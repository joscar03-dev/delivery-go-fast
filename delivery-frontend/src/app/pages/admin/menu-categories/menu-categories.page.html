<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backHref"></ion-back-button>
    </ion-buttons>
    <ion-title>Categorías de Menú</ion-title>
  </ion-toolbar>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-button (click)="goToItems()">
        <ion-icon slot="start" name="list-outline"></ion-icon>
        Ítems del Menú
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="openCreateModal()">Nueva categoría</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item lines="none">
    <ion-label>
      <h2>Restaurante: {{ restaurant?.name || '...' }}</h2>
      <p *ngIf="restaurant?.address">{{ restaurant?.address }}</p>
    </ion-label>
  </ion-item>
  <ion-list *ngIf="!loading; else sk">
    <ion-item *ngFor="let c of list">
      <ion-label>
        <h2>{{ c.name }}</h2>
        <p>{{ c.description }}</p>
        <p *ngIf="c.sortOrder != null">Orden: {{ c.sortOrder }}</p>
        <ion-badge [color]="c.isActive ? 'success' : 'medium'"
          >{{ c.isActive ? 'Activa' : 'Inactiva' }}</ion-badge
        >
      </ion-label>
      <ion-button slot="end" fill="clear" (click)="edit(c)">Editar</ion-button>
      <ion-button
        slot="end"
        fill="clear"
        color="warning"
        (click)="toggleActive(c)"
        >{{ c.isActive ? 'Desactivar' : 'Activar' }}</ion-button
      >
      <ion-button slot="end" fill="clear" color="danger" (click)="remove(c)"
        >Eliminar</ion-button
      >
    </ion-item>
  </ion-list>

  <ng-template #sk>
    <ion-item>
      <ion-label>Cargando...</ion-label>
      <ion-spinner></ion-spinner>
    </ion-item>
  </ng-template>

  <!-- Creación mediante modal; se removió el formulario inline -->
</ion-content>
