<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/restaurants"></ion-back-button>
    </ion-buttons>
    <ion-title>Restaurante (crear/editar)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="save()">
    <ion-item>
      <ion-input label="Nombre" labelPlacement="stacked" formControlName="name" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Dirección" labelPlacement="stacked" formControlName="address" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Teléfono" labelPlacement="stacked" formControlName="phone" required></ion-input>
    </ion-item>
    
    <!-- Campo de imagen con preview -->
    <ion-item>
      <ion-label position="stacked">Imagen del Restaurante</ion-label>
      <input 
        type="file" 
        accept="image/*" 
        (change)="onImageSelected($event)"
        #fileInput
        style="margin-top: 10px;"
      />
    </ion-item>
    
    <!-- Preview de la imagen -->
    <ion-item *ngIf="imagePreview" lines="none">
      <div style="width: 100%; text-align: center; padding: 10px;">
        <img [src]="imagePreview" alt="Preview" style="max-width: 300px; max-height: 200px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" />
        <ion-button fill="clear" color="danger" (click)="clearImage()">
          <ion-icon name="trash-outline"></ion-icon>
          Eliminar imagen
        </ion-button>
      </div>
    </ion-item>
    
    <ion-item>
      <ion-input type="number" label="Latitud" labelPlacement="stacked" formControlName="latitude" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-input type="number" label="Longitud" labelPlacement="stacked" formControlName="longitude" required></ion-input>
    </ion-item>
    <ion-button type="button" (click)="useMyLocation()" [disabled]="locating">
      {{ locating ? 'Obteniendo ubicación...' : 'Usar mi ubicación' }}
    </ion-button>
    <ion-item>
      <ion-select label="Categoría" labelPlacement="stacked" formControlName="restaurantCategoryId">
        <ion-select-option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item>
      <ion-select label="Dueño (opcional)" labelPlacement="stacked" formControlName="ownerId">
        <ion-select-option [value]="null">— Sin dueño —</ion-select-option>
        <ion-select-option *ngFor="let o of owners" [value]="o.id">{{ o.label }} ({{ o.role }})</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-button type="submit" [disabled]="form.invalid">Guardar</ion-button>
  </form>
</ion-content>
