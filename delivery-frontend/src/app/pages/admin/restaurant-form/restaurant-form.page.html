<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/restaurants"></ion-back-button>
    </ion-buttons>
    <ion-title>Restaurante (crear/editar)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-container">
    <form [formGroup]="form" (ngSubmit)="save()">
      <ion-item class="custom-item">
        <ion-input
          label="Nombre"
          labelPlacement="stacked"
          formControlName="name"
          required
        ></ion-input>
      </ion-item>
      <ion-item class="custom-item">
        <ion-input
          label="Dirección"
          labelPlacement="stacked"
          formControlName="address"
          required
        ></ion-input>
      </ion-item>
      <ion-item class="custom-item">
        <ion-input
          label="Teléfono"
          labelPlacement="stacked"
          formControlName="phone"
          required
        ></ion-input>
      </ion-item>

      <ion-item class="custom-item">
        <ion-select
          label="Ciudad"
          labelPlacement="stacked"
          formControlName="city"
          interface="action-sheet"
        >
          <ion-select-option *ngFor="let city of cities" [value]="city">
            {{ city }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Campo de imagen con preview -->
      <div class="image-upload-container">
        <ion-label>Imagen del Restaurante</ion-label>
        <button
          type="button"
          class="image-upload-button"
          (click)="fileInput.click()"
        >
          <ion-icon name="cloud-upload-outline"></ion-icon>
          <span
            >{{ imagePreview ? 'Cambiar imagen' : 'Seleccionar imagen' }}</span
          >
        </button>
        <input
          type="file"
          accept="image/*"
          (change)="onImageSelected($event)"
          #fileInput
          hidden
        />
      </div>

      <!-- Preview de la imagen -->
      <div *ngIf="imagePreview" class="image-preview-wrapper">
        <img [src]="imagePreview" alt="Preview" class="image-preview" />
        <ion-button
          fill="clear"
          color="danger"
          (click)="clearImage()"
          class="delete-image-button"
        >
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>

      <!-- Coordenadas -->
      <ion-grid>
        <ion-row>
          <ion-col size="6">
            <ion-item class="custom-item">
              <ion-input
                type="number"
                label="Latitud"
                labelPlacement="stacked"
                formControlName="latitude"
                required
              ></ion-input>
            </ion-item>
          </ion-col>
          <ion-col size="6">
            <ion-item class="custom-item">
              <ion-input
                type="number"
                label="Longitud"
                labelPlacement="stacked"
                formControlName="longitude"
                required
              ></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>
      <ion-button
        expand="block"
        fill="outline"
        (click)="useMyLocation()"
        [disabled]="locating"
        class="location-button"
      >
        <ion-icon name="location-outline" slot="start"></ion-icon>
        {{ locating ? 'Obteniendo...' : 'Usar mi ubicación' }}
      </ion-button>

      <ion-item class="custom-item">
        <ion-select
          label="Categoría"
          labelPlacement="stacked"
          formControlName="restaurantCategoryId"
        >
          <ion-select-option *ngFor="let c of categories" [value]="c.id"
            >{{ c.name }}</ion-select-option
          >
        </ion-select>
      </ion-item>
      <ion-item class="custom-item">
        <ion-select
          label="Dueño (opcional)"
          labelPlacement="stacked"
          formControlName="ownerId"
        >
          <ion-select-option [value]="null">— Sin dueño —</ion-select-option>
          <ion-select-option *ngFor="let o of owners" [value]="o.id"
            >{{ o.label }} ({{ o.role }})</ion-select-option
          >
        </ion-select>
      </ion-item>

      <div class="save-button-container">
        <ion-button type="submit" [disabled]="form.invalid" expand="block">
          <ion-icon name="save-outline" slot="start"></ion-icon>
          Guardar
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
