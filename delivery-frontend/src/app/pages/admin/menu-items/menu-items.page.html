<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/restaurants"></ion-back-button>
    </ion-buttons>
    <ion-title>Ítems de Menú</ion-title>
  </ion-toolbar>
  <ion-toolbar color="light">
    <ion-buttons slot="end">
      <ion-button (click)="openCreateModal()">Nuevo ítem</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item lines="none">
    <ion-label>
      <h2>Restaurante: {{ restaurant?.name || '...' }}</h2>
      <p *ngIf="restaurant?.address">{{ restaurant?.address }}</p>
    </ion-label>
  </ion-item>
  <ion-list *ngIf="!loading; else sk">
    <ion-item *ngFor="let it of list">
      <!-- Thumbnail de la imagen si existe -->
      <ion-thumbnail slot="start" *ngIf="it.imageUrl">
        <img [src]="it.imageUrl" [alt]="it.name" />
      </ion-thumbnail>
      
      <ion-label>
        <h2>{{ it.name }} - {{ it.price | currency:'USD':'symbol':'1.2-2' }}</h2>
        <p *ngIf="it.description">{{ it.description }}</p>
        <p *ngIf="it.menuCategoryId">
          <ion-chip color="primary" outline>
            <ion-icon name="pricetag-outline"></ion-icon>
            <ion-label>{{ getCategoryName(it.menuCategoryId) || it.menuCategoryId }}</ion-label>
          </ion-chip>
        </p>
      </ion-label>
      
      <ion-button slot="end" fill="clear" (click)="edit(it)">
        <ion-icon name="create-outline"></ion-icon>
      </ion-button>
      <ion-button slot="end" fill="clear" color="danger" (click)="remove(it)">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ng-template #sk>
    <ion-item>
      <ion-label>Cargando...</ion-label>
      <ion-spinner></ion-spinner>
    </ion-item>
  </ng-template>
 
</ion-content>
