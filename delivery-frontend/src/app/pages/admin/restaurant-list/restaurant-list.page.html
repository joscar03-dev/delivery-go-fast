<!-- Menu lateral para acciones (lado derecho) -->
<ion-menu contentId="main-content" menuId="admin-menu" side="end">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Opciones</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item button routerLink="/admin/restaurants/form">
        <ion-icon slot="start" name="add-circle"></ion-icon>
        <ion-label>Crear restaurante</ion-label>
      </ion-item>
      <ion-item button routerLink="/admin/restaurants/categories">
        <ion-icon slot="start" name="pricetags"></ion-icon>
        <ion-label>Categorías de restaurantes</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/tabs/admin"></ion-back-button>
      </ion-buttons>
      <ion-title>Restaurantes</ion-title>
      <ion-buttons slot="end">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ion-list>
      <ion-item *ngFor="let r of list">
        <ion-label>
          <h2>{{ r.name }}</h2>
          <p>{{ r.address }} — {{ r.phone }}</p>
          <p *ngIf="r.city">
            <ion-badge color="primary">{{ r.city }}</ion-badge>
          </p>
        </ion-label>
        <ion-button slot="end" fill="clear" [id]="'action-sheet-' + r.id">
          <ion-icon name="ellipsis-vertical"></ion-icon>
        </ion-button>

        <!-- Action Sheet para cada restaurante -->
        <ion-action-sheet
          [trigger]="'action-sheet-' + r.id"
          [header]="r.name"
          [buttons]="getActionSheetButtons(r)"
        ></ion-action-sheet>
      </ion-item>
    </ion-list>
    <ion-spinner *ngIf="loading"></ion-spinner>
  </ion-content>
</div>
