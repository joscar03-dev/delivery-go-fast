<ion-content>
  <ng-container *ngIf="item && !loading; else loadingTpl">
    <!-- Sticky Header with Back Button -->
    <div class="sticky-header">
      <ion-buttons>
        <ion-back-button
          defaultHref="/restaurant/{id}"
          class="custom-back-btn"
        ></ion-back-button>
      </ion-buttons>
      <div class="header-spacer"></div>
    </div>

    <!-- Item Image -->
    <div class="image-container">
      <div
        class="item-image"
        [style.background-image]="item.imageUrl ? 'url(' + item.imageUrl + ')' : 'url(https://via.placeholder.com/800x320)'"
      ></div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Item Title and Description -->
      <h1 class="item-title">{{ item.name }}</h1>
      <p class="item-description" *ngIf="item.description">
        {{ item.description }}
      </p>

      <!-- Quantity Selector -->
      <div class="quantity-section">
        <div class="quantity-left">
          <div class="quantity-icon">
            <ion-icon name="cart-outline"></ion-icon>
          </div>
          <p class="quantity-label">Cantidad</p>
        </div>
        <div class="quantity-controls">
          <button
            class="quantity-btn minus"
            (click)="decreaseQuantity()"
            [disabled]="quantity <= 1"
          >
            -
          </button>
          <span class="quantity-value">{{ quantity }}</span>
          <button class="quantity-btn plus" (click)="increaseQuantity()">
            +
          </button>
        </div>
      </div>

      <!-- Comments Section -->
      <div class="comments-section">
        <label for="comments" class="comments-label">Comentarios</label>
        <textarea
          id="comments"
          class="comments-textarea"
          placeholder="¿Instrucciones especiales? Ej: sin cebolla."
          rows="3"
          [(ngModel)]="comment"
        ></textarea>
      </div>

      <!-- Customization Options -->
      <div class="customization-section" *ngIf="groups?.length">
        <h2 class="customization-title">Personalizar Pedido</h2>

        <div class="options-list">
          <!-- Option Group -->
          <div
            *ngFor="let g of groups"
            class="option-group"
            [class.invalid]="!groupValid(g)"
          >
            <div class="group-header">
              <h3 class="group-name">{{ g.name }}</h3>
              <span class="group-badge" [class.required]="g.isRequired">
                {{ g.isRequired ? 'Requerido' : 'Opcional' }}
              </span>
            </div>

            <!-- Single Selection (Radio) -->
            <div class="options-container" *ngIf="g.maxSelect === 1">
              <label
                *ngFor="let o of g.options"
                class="option-item"
                [class.selected]="isChecked(g.id, o.id)"
              >
                <span class="option-name">{{ o.name }}</span>
                <input
                  type="radio"
                  [name]="'group-' + g.id"
                  [value]="o.id"
                  (change)="onRadioChange(g.id, o.id)"
                  class="option-radio"
                />
              </label>
            </div>

            <!-- Multiple Selection (Checkbox) -->
            <div class="options-container" *ngIf="g.maxSelect !== 1">
              <label
                *ngFor="let o of g.options"
                class="option-item"
                [class.selected]="isChecked(g.id, o.id)"
              >
                <div class="option-left">
                  <input
                    type="checkbox"
                    [checked]="isChecked(g.id, o.id)"
                    (change)="onCheckboxChange(g, o, $any($event.target).checked)"
                    class="option-checkbox"
                  />
                  <span class="option-name">{{ o.name }}</span>
                </div>
                <span class="option-price" *ngIf="o.extraPrice">
                  + {{ o.extraPrice | penCurrency }}
                </span>
              </label>
            </div>

            <!-- Validation Error -->
            <div class="group-error" *ngIf="!groupValid(g)">
              <ion-note color="danger"
                >Revisa tu selección para este grupo</ion-note
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Fixed Bottom Actions -->
    <div class="bottom-actions">
      <div class="actions-container">
        <button
          class="action-btn secondary"
          [disabled]="!allValid()"
          (click)="addToCart(false)"
        >
          <span>Añadir al carrito</span>
        </button>
        <button
          class="action-btn primary"
          [disabled]="!allValid()"
          (click)="addToCart(true)"
        >
          <span>Agregar e ir a pagar</span>
        </button>
      </div>
    </div>
  </ng-container>

  <!-- Loading Template -->
  <ng-template #loadingTpl>
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando...</p>
    </div>
  </ng-template>
</ion-content>

<!-- Toast -->
<ion-toast
  [isOpen]="showToast"
  [message]="toastMessage"
  duration="1500"
  position="bottom"
  (didDismiss)="showToast=false"
></ion-toast>
