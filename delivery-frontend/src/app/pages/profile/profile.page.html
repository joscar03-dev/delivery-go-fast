<ion-content>
  <!-- Fondo con forma de ola -->
  <app-wave-background></app-wave-background>

  <!-- Header personalizado dentro del content -->
  <div class="custom-header">
    <ion-buttons>
      <ion-back-button defaultHref="/tabs/business"></ion-back-button>
    </ion-buttons>
    <h1 class="header-title">Mi Perfil</h1>
    <div class="header-spacer"></div>
  </div>

  <div class="content-wrapper">
    <ng-container *ngIf="!loading; else loadingTpl">
      <!-- Profile Header Section -->
      <section class="profile-header" *ngIf="user; else emptyTpl">
        <div class="profile-info">
          <div class="profile-avatar">
            <ion-icon name="person-circle-outline"></ion-icon>
          </div>
          <div class="profile-details">
            <h2 class="profile-name">{{ user.name || user.email }}</h2>
            <p class="profile-email">{{ user.email }}</p>
          </div>
        </div>
        <ion-button class="edit-profile-btn" expand="block">
          <span>Editar Perfil</span>
        </ion-button>
      </section>

      <!-- Account Management Group -->
      <div class="options-group">
        <ion-item
          button
          routerLink="/tabs/order-history"
          lines="none"
          class="option-item"
        >
          <div class="option-icon" slot="start">
            <ion-icon name="receipt-outline"></ion-icon>
          </div>
          <ion-label>
            <h3>Historial de Pedidos</h3>
          </ion-label>
          <ion-icon
            name="chevron-forward-outline"
            slot="end"
            class="chevron-icon"
          ></ion-icon>
        </ion-item>

        <div class="divider"></div>

        <ion-item
          button
          (click)="goToAddresses()"
          lines="none"
          class="option-item"
        >
          <div class="option-icon" slot="start">
            <ion-icon name="location-outline"></ion-icon>
          </div>
          <ion-label>
            <h3>Gestionar Direcciones</h3>
          </ion-label>
          <ion-icon
            name="chevron-forward-outline"
            slot="end"
            class="chevron-icon"
          ></ion-icon>
        </ion-item>
      </div>

      <!-- Business & Partnership Group -->
      <div class="options-group">
        <ion-item
          button
          lines="none"
          class="option-item"
          (click)="navigateToDriverApplication()"
        >
          <div class="option-icon" slot="start">
            <ion-icon name="bicycle-outline"></ion-icon>
          </div>
          <ion-label>
            <h3>Registrarse como driver</h3>
          </ion-label>
          <ion-icon
            name="chevron-forward-outline"
            slot="end"
            class="chevron-icon"
          ></ion-icon>
        </ion-item>

        <div class="divider"></div>

        <ion-item button lines="none" class="option-item">
          <div class="option-icon" slot="start">
            <ion-icon name="storefront-outline"></ion-icon>
          </div>
          <ion-label>
            <h3>¿Tienes un negocio?</h3>
          </ion-label>
          <ion-icon
            name="chevron-forward-outline"
            slot="end"
            class="chevron-icon"
          ></ion-icon>
        </ion-item>
      </div>

      <!-- Support & Legal Group -->
      <div class="options-group">
        <ion-item button lines="none" class="option-item">
          <div class="option-icon" slot="start">
            <ion-icon name="headset-outline"></ion-icon>
          </div>
          <ion-label>
            <h3>Contactar soporte</h3>
          </ion-label>
          <ion-icon
            name="chevron-forward-outline"
            slot="end"
            class="chevron-icon"
          ></ion-icon>
        </ion-item>

        <div class="divider"></div>

        <ion-item button lines="none" class="option-item">
          <div class="option-icon" slot="start">
            <ion-icon name="document-text-outline"></ion-icon>
          </div>
          <ion-label>
            <h3>Términos y condiciones</h3>
          </ion-label>
          <ion-icon
            name="chevron-forward-outline"
            slot="end"
            class="chevron-icon"
          ></ion-icon>
        </ion-item>

        <div class="divider"></div>

        <ion-item button lines="none" class="option-item">
          <div class="option-icon" slot="start">
            <ion-icon name="shield-checkmark-outline"></ion-icon>
          </div>
          <ion-label>
            <h3>Políticas de privacidad</h3>
          </ion-label>
          <ion-icon
            name="chevron-forward-outline"
            slot="end"
            class="chevron-icon"
          ></ion-icon>
        </ion-item>
      </div>

      <!-- Session & Account Actions -->
      <div class="action-buttons">
        <ion-button
          expand="block"
          fill="clear"
          class="logout-btn"
          (click)="logout()"
        >
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <span>Cerrar Sesión</span>
        </ion-button>

        <ion-button expand="block" fill="clear" class="delete-account-btn">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          <span>Eliminar cuenta</span>
        </ion-button>
      </div>
    </ng-container>
  </div>

  <ng-template #loadingTpl>
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  </ng-template>

  <ng-template #emptyTpl>
    <div class="empty-container">
      <ion-text color="medium">No se pudo cargar el perfil.</ion-text>
    </div>
  </ng-template>
</ion-content>
