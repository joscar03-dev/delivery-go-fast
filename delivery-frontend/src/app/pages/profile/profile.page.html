<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1"></ion-back-button>
    </ion-buttons>
    <ion-title>Mi cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ng-container *ngIf="!loading; else loadingTpl">
    <ion-card *ngIf="user; else emptyTpl">
      <ion-card-header>
        <ion-card-title>{{ user.name || user.email }}</ion-card-title>
        <ion-card-subtitle>Rol: {{ user.role || '—' }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p>Email: {{ user.email }}</p>
        <p>ID: {{ user.id }}</p>
      </ion-card-content>
    </ion-card>

    <!-- Acciones de Usuario -->
    <ion-list-header>Mis Pedidos</ion-list-header>
    <ion-list [inset]="true">
      <ion-item button routerLink="/order-history" lines="none">
        <ion-icon name="receipt-outline" slot="start"></ion-icon>
        <ion-label>
          <h2>Historial de Pedidos</h2>
          <p>Ver todos mis pedidos anteriores</p>
        </ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>
    </ion-list>

    <!-- Configuración de Apariencia -->
    <ion-list-header>Apariencia</ion-list-header>
    <ion-list [inset]="true">
      <ion-item>
        <ion-toggle
          [(ngModel)]="paletteToggle"
          (ionChange)="toggleChange($event)"
          justify="space-between"
        >
          <ion-icon name="moon-outline" slot="start"></ion-icon>
          Modo Oscuro
        </ion-toggle>
      </ion-item>
    </ion-list>

    <!-- Botón de cerrar sesión -->
    <ion-button
      color="medium"
      expand="block"
      class="ion-margin-top"
      (click)="logout()"
    >
      Cerrar sesión
    </ion-button>
  </ng-container>

  <ng-template #loadingTpl>
    <ion-spinner name="crescent"></ion-spinner>
  </ng-template>

  <ng-template #emptyTpl>
    <ion-text color="medium">No se pudo cargar el perfil.</ion-text>
  </ng-template>
</ion-content>
