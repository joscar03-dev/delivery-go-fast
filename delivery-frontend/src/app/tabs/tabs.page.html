<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="business" href="/tabs/business">
      <ion-icon aria-hidden="true" name="business"></ion-icon>
      <ion-label>Restaurantes</ion-label>
    </ion-tab-button>

    <!-- Carrito -->
    <ion-tab-button tab="cart" href="/tabs/cart">
      <ion-icon aria-hidden="true" name="cart"></ion-icon>
      <ion-label>Carrito</ion-label>
      <ion-badge *ngIf="cartItemCount() > 0" color="danger" class="cart-badge">
        {{ cartItemCount() }}
      </ion-badge>
    </ion-tab-button>

    <!-- Mis Pedidos -->
    <!-- <ion-tab-button tab="order-history" href="/tabs/order-history">
      <ion-icon aria-hidden="true" name="receipt-outline"></ion-icon>
      <ion-label>Mis Pedidos</ion-label>
    </ion-tab-button> -->

    <!-- Tab para Repartidores -->
    <ion-tab-button
      *ngIf="isDeliveryDriver()"
      routerLink="/delivery-driver"
      routerDirection="forward"
    >
      <ion-icon aria-hidden="true" name="bicycle-outline"></ion-icon>
      <ion-label>Entregas</ion-label>
    </ion-tab-button>

    <!-- Tab para Restaurant Owners -->
    <ion-tab-button
      *ngIf="isRestaurantOwner()"
      tab="restaurant-admin"
      href="/tabs/restaurant-admin"
    >
      <ion-icon aria-hidden="true" name="restaurant-outline"></ion-icon>
      <ion-label>Mi Restaurante</ion-label>
    </ion-tab-button>

    <ion-tab-button *ngIf="isSuperAdmin()" tab="admin" href="/tabs/admin">
      <ion-icon aria-hidden="true" name="code-working"></ion-icon>
      <ion-label>Admin</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="account" href="/tabs/account">
      <ion-icon aria-hidden="true" name="person"></ion-icon>
      <ion-label>Cuenta</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
