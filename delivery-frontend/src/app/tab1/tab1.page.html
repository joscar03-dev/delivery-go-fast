<ion-header>
  <ion-toolbar>
    <ion-title size="large">Go Fast</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear">
        <ion-icon name="search"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Banner/Título principal -->
  <div class="welcome-banner">
    <h1>Go Fast</h1>
    <p>Descubre los mejores restaurantes</p>
  </div>

  <!-- Carrusel de restaurantes con Swiper -->
  <div class="swiper-container">
    <swiper-container
      slides-per-view="1.2"
      space-between="10"
      centered-slides="true"
      autoplay-delay="3000"
      autoplay-disable-on-interaction="false"
    >
      <swiper-slide *ngFor="let r of list" (click)="navigateToRestaurant(r.id)">
        <div class="restaurant-card">
          <div class="restaurant-image">
            <img [src]="r.imageUrl || 'assets/shapes.svg'" [alt]="r.name" />
          </div>
          <div class="restaurant-info">
            <h3>{{ r.name }}</h3>
            <p>{{ r.address }}</p>
            <ion-chip *ngIf="r.category?.name" color="primary">
              {{ r.category?.name }}
            </ion-chip>
          </div>
        </div>
      </swiper-slide>
    </swiper-container>
  </div>

  <div class="categories-filter">
    <swiper-container
      slides-per-view="auto"
      space-between="8"
      free-mode="true"
      class="categories-swiper"
    >
      <swiper-slide class="chip-slide">
        <ion-chip [outline]="!selectedCategory" (click)="setFilter(null)"
          >Todos</ion-chip
        >
      </swiper-slide>
      <swiper-slide class="chip-slide" *ngFor="let c of categories">
        <ion-chip
          [outline]="selectedCategory !== c.name"
          (click)="setFilter(c.name)"
        >
          {{ c.name }}
        </ion-chip>
      </swiper-slide>
    </swiper-container>
  </div>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let r of filtered">
        <ion-card [routerLink]="['/restaurant', r.id]" button>
          <img [src]="r.imageUrl || 'assets/shapes.svg'" [alt]="r.name" />
          <ion-card-header>
            <ion-card-title>{{ r.name }}</ion-card-title>
            <ion-card-subtitle>{{ r.address }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-chip *ngIf="r.category?.name" color="primary">
              {{ r.category?.name }}
            </ion-chip>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
