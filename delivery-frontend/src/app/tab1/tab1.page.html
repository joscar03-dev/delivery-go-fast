<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 1
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <ion-chip [outline]="!selectedCategory" (click)="setFilter(null)">Todos</ion-chip>
    <ion-chip *ngFor="let c of categories" [outline]="selectedCategory !== c.name" (click)="setFilter(c.name)">
      {{ c.name }}
    </ion-chip>
  </div>
  <ion-list>
    <ion-item *ngFor="let r of filtered" [routerLink]="['/restaurant', r.id]" detail>
      <ion-label>
        <h2>{{ r.name }}</h2>
        <p>{{ r.address }}</p>
        <small *ngIf="r.category?.name">{{ r.category?.name }}</small>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
