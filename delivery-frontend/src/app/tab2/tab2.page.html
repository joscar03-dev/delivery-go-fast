<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Panel Admin </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Panel Admin</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <ion-grid>
      <ion-row>
        <ion-col size="12" size-md="6">
          <ion-card button [routerLink]="['/admin/restaurants']">
            <ion-card-header>
              <ion-card-title>
                <ion-icon name="restaurant-outline"></ion-icon>
                Restaurantes
              </ion-card-title>
            </ion-card-header>
            <ion-card-content>
              Gestiona restaurantes, menús y categorías
            </ion-card-content>
          </ion-card>
        </ion-col>
        <ion-col size="12" size-md="6">
          <ion-card button [routerLink]="['/admin/users']">
            <ion-card-header>
              <ion-card-title>
                <ion-icon name="people-outline"></ion-icon>
                Usuarios
              </ion-card-title>
            </ion-card-header>
            <ion-card-content>
              Administra usuarios y permisos
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
  <ng-template #loadingTpl>
    <ion-spinner class="ion-padding"></ion-spinner>
  </ng-template>
</ion-content>
